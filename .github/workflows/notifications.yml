name: Scheduled notifications

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只验证调度和测试，不等待、不发送微信'
        type: boolean
        default: false
  schedule:
    # 全天每 10 分钟尝试触发；处理最近到期未发送的消息，并提前准备未来消息。
    # 避开整点，并在 07:45、10:58、14:58、21:58 增加一次检查。
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '45 23 * * *'
    - cron: '58 2,6,13 * * *'

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notifications: ${{ steps.schedule.outputs.notifications }}
      has_notifications: ${{ steps.schedule.outputs.has_notifications }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan pending and upcoming notifications
        id: schedule
        run: node scripts/check-schedule.cjs

  verify:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  notify:
    needs: plan
    if: inputs.dry_run != true && needs.plan.outputs.has_notifications == 'true'
    name: Send ${{ matrix.notification.type }}
    runs-on: ubuntu-latest
    # 最多提前 4 小时准备，等待在 runner 内完成；小于 GitHub 托管任务的 6 小时限制。
    timeout-minutes: 270
    strategy:
      fail-fast: false
      matrix:
        notification: ${{ fromJSON(needs.plan.outputs.notifications) }}
    # 同一天、同一种消息串行；等待晚安不会阻塞其他种类的消息。
    concurrency:
      group: scheduled-${{ matrix.notification.id }}
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - name: Check delivery record for the planned date
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_ID: ${{ matrix.notification.id }}
        run: |
          delivered=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NOTIFICATION_ID}" --jq '.artifacts | any(.expired == false)')
          echo "delivered=$delivered" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.delivery.outputs.delivered == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.delivery.outputs.delivered == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.delivery.outputs.delivered == 'false'
        run: pnpm install --frozen-lockfile

      - name: Wait for scheduled Beijing time
        if: steps.delivery.outputs.delivered == 'false'
        id: window
        run: node scripts/wait-until.cjs
        env:
          NOTIFICATION_SCHEDULED_AT: ${{ matrix.notification.scheduledAt }}

      - name: Recheck delivery record before sending
        if: steps.window.outputs.ready == 'true'
        id: delivery_at_send
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFICATION_ID: ${{ matrix.notification.id }}
        run: |
          delivered=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NOTIFICATION_ID}" --jq '.artifacts | any(.expired == false)')
          echo "delivered=$delivered" >> "$GITHUB_OUTPUT"

      - name: Send notification
        if: steps.window.outputs.ready == 'true' && steps.delivery_at_send.outputs.delivered == 'false'
        id: send
        run: pnpm start
        env:
          WX_COMPANY_ID: ${{ secrets.WX_COMPANY_ID }}
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          TIAN_API_KEY: ${{ secrets.TIAN_API_KEY }}
          MESSAGE_TYPE: ${{ matrix.notification.type }}
          NOTIFICATION_DATE: ${{ matrix.notification.date }}
          ENFORCE_SCHEDULE: 'true'
          NOTIFICATION_MARKER: .notification-sent

      # 即使后续内容请求失败，已发送的消息也要记录，避免下一次检查重复发送。
      - name: Save delivery record for the planned date
        if: always() && steps.send.outputs.sent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.notification.id }}
          path: .notification-sent
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

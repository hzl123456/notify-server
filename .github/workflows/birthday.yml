name: Birthday notify for you
on:
  workflow_dispatch:
  # 自动发送统一由 notifications.yml 检查时间和去重。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai

    steps:
      # 1. checkout 仓库
      - uses: actions/checkout@v4

      # 2. 设置pnpm包管理器
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. 设置Node环境
      - name: Set node version to 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm' # 配置缓存，优化安装性能

      # 4. 安装依赖
      - name: Install
        run: pnpm install --frozen-lockfile

      # 5. 运行脚本
      - name: 运行脚本
        run: pnpm start
        env:
          WX_COMPANY_ID: ${{ secrets.WX_COMPANY_ID }}
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          TIAN_API_KEY: ${{ secrets.TIAN_API_KEY }}
          MESSAGE_TYPE: birthday
